name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Bundle Firebase SDK so the app starts without internet
        run: |
          mkdir -p app/src/main/assets/vendor
          for f in app auth firestore; do
            curl -fsSL -o "app/src/main/assets/vendor/firebase-$f-compat.js" \
              "https://www.gstatic.com/firebasejs/10.12.2/firebase-$f-compat.js"
          done

      - name: Use Firebase config from repository secret (if set)
        env:
          FIREBASE_CONFIG_JS: ${{ secrets.FIREBASE_CONFIG_JS }}
        run: |
          if [ -n "$FIREBASE_CONFIG_JS" ]; then
            printf '%s\n' "$FIREBASE_CONFIG_JS" > app/src/main/assets/firebase-config.js
            echo "Using Firebase config from secret"
          else
            echo "No FIREBASE_CONFIG_JS secret: using app/src/main/assets/firebase-config.js as committed"
          fi

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk KavaEratap.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KavaEratap-apk
          path: KavaEratap.apk

      - name: Publish as a GitHub Release (download link for phones)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kava Eratap 1.0.${{ github.run_number }}
          files: KavaEratap.apk
          make_latest: true
